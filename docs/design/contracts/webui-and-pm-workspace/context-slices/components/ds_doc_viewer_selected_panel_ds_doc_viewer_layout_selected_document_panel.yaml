ds_id: "ds:doc-viewer-selected-panel"
screen_id: "ds-doc-viewer"
route: "/design-system/doc-viewer"
route_family: "showcase"
screen_ds_id: "ds:screen:doc-viewer-001"
component_path: "layout/selected_document_panel"
component_type: "selected_document_panel"
layout_type: "github_like_doc_viewer"
states:
  - "default"
  - "loading"
  - "empty"
  - "error"
  - "offline"
  - "forbidden"
actions:
  - id: "action:doc-viewer-open-explorer"
    label: "Open Explorer"
    target: "/design-system/explorer"
  - id: "action:doc-viewer-open-knowledge-graph"
    label: "Open Knowledge Graph"
    target: "/design-system/knowledge-graph"
  - id: "action:doc-viewer-open-core-trace"
    label: "Open Beads trace"
    target: "/trace/:id"
bindings:
  - "api:docs-detail"
