ds_id: ds:git-graph-showcase:scenario-selector
type: ScenarioSelector
parent_ds_id: ds:git-graph-showcase:surface
actions:
- EVENT_HASH_NAVIGATE
screen_id: screen:ds-git-graph
screen_route: /design-system/git-graph
screen_ds_id: ds:screen:git-graph-showcase-001
prd_ds_id: ds:screen:git-graph-001
states:
- default
- loading
- empty
- error
- offline
- forbidden
bindings:
- GET /api/git/graph?scenario=<id>
- GET /api/trace/:id?include=git
layout: hash-selected git graph scenarios with branches, commits, connections, tags,
  and stats
behaviors:
- support gitflow, multi-agent, hotfix, release-train, monorepo, beads-prd-trace,
  beads-deadlock, beads-ds-comp, beads-traversal, and beads-sprint-review scenarios
- render backend-aggregated git and Beads trailer lineage
api_gateway: gmind serve Go REST API
hash_route_interactions:
- hash navigation updates route component state
