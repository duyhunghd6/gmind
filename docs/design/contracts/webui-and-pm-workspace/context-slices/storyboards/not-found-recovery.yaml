trajectory_id: not-found-recovery
role: PM
journey: Recover from missing task or storyboard detail
entry_path: /tasks/missing
events:
- EVENT_ROUTE_ENTER
- EVENT_BACK
states:
- loading
- default
- empty
- error
- offline
- forbidden
error_paths:
- API_ERROR -> ErrorState -> EVENT_REFRESH
- API_FORBIDDEN -> ForbiddenState -> EVENT_BACK
- EVENT_DISCONNECT -> OfflineState -> EVENT_RECONNECT
screens:
- screen:task-detail
- screen:storyboard-detail
step_refs:
- step: 1
  screen_id: screen:task-detail
  screen_path: /tasks/:id
  data_ds_id: ds:screen:task-detail-001
  expected_state: loading_to_default
  event: EVENT_ROUTE_ENTER
  action: Dispatch EVENT_ROUTE_ENTER and verify screen:task-detail reaches loading_to_default
  hash_anchor: null
- step: 2
  screen_id: screen:storyboard-detail
  screen_path: /storyboards/:id
  data_ds_id: ds:screen:storyboard-detail-001
  expected_state: default
  event: EVENT_BACK
  action: Dispatch EVENT_BACK and verify screen:storyboard-detail reaches default
  hash_anchor: null
