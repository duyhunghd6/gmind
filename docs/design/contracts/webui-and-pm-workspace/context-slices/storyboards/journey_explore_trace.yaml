trajectory_id: journey-explore-trace
title: Explore Trace
source_refs:
- br-prd04-s8
- br-prd04-s14
route: /trace/:id
screen_id: core-trace-explorer
journey_type: prd_journey
steps:
- state: route-entry
  screen_id: core-task-detail
  event: EVENT_OPEN_FULL_TRACE
  expected: navigation begins from mapped route
- state: default
  screen_id: core-trace-explorer
  event: API_SUCCESS
  expected: target screen reaches default state
- state: default
  screen_id: core-trace-explorer
  event: EVENT_CORE_TRACE_SELECT_NODE
  expected: primary journey action is recorded
- state: error
  screen_id: core-trace-explorer
  event: API_ERROR
  expected: error recovery path supports retry or back navigation
