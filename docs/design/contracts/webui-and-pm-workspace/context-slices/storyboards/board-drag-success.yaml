trajectory_id: board-drag-success
role: RTE
journey: Move board card with optimistic persistence
entry_path: "/board#sprint"
events:
- EVENT_HASH_NAVIGATE
- EVENT_MOVE_CARD
- EVENT_VIEW_TASK
states:
- loading
- default
- empty
- error
- offline
- forbidden
error_paths:
- API_ERROR -> ErrorState -> EVENT_REFRESH
- API_FORBIDDEN -> ForbiddenState -> EVENT_BACK
- EVENT_DISCONNECT -> OfflineState -> EVENT_RECONNECT
screens:
- screen:safe-board
- screen:task-detail
step_refs:
- step: 1
  screen_id: screen:safe-board
  screen_path: /board
  data_ds_id: ds:screen:kanban-001
  expected_state: loading_to_default
  event: EVENT_HASH_NAVIGATE
  action: Dispatch EVENT_HASH_NAVIGATE and verify screen:safe-board reaches loading_to_default
  hash_anchor: null
- step: 2
  screen_id: screen:task-detail
  screen_path: /tasks/:id
  data_ds_id: ds:screen:task-detail-001
  expected_state: default
  event: EVENT_MOVE_CARD
  action: Dispatch EVENT_MOVE_CARD and verify screen:task-detail reaches default
  hash_anchor: null
