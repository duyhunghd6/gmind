trajectory_id: core-explore-trace
role: PMO
journey: Open task graph and promote to full trace explorer
entry_path: /trace/bd-x1y2
events:
- EVENT_HASH_NAVIGATE
- EVENT_VIEW_TRACE
states:
- loading
- default
- empty
- error
- offline
- forbidden
error_paths:
- API_ERROR -> ErrorState -> EVENT_REFRESH
- API_FORBIDDEN -> ForbiddenState -> EVENT_BACK
- EVENT_DISCONNECT -> OfflineState -> EVENT_RECONNECT
screens:
- screen:task-detail
- screen:document-graph-widget
- screen:trace-explorer
step_refs:
- step: 1
