  action: Dispatch EVENT_HASH_NAVIGATE and verify screen:task-detail reaches loading_to_default
  hash_anchor: null
- step: 2
  screen_id: screen:document-graph-widget
  screen_path: embedded
  data_ds_id: ds:screen:document-graph-widget-001
  expected_state: default
  event: EVENT_VIEW_TRACE
  action: Dispatch EVENT_VIEW_TRACE and verify screen:document-graph-widget reaches default
  hash_anchor: null
- step: 3
  screen_id: screen:trace-explorer
  screen_path: /trace/:id
  data_ds_id: ds:screen:trace-explorer-001
  expected_state: default
  event: EVENT_VIEW_TRACE
  action: Dispatch EVENT_VIEW_TRACE and verify screen:trace-explorer reaches default
  hash_anchor: null
