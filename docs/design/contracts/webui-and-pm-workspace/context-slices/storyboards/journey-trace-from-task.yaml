trajectory_id: journey-trace-from-task
title: Trace from Task
source: PRD-04 user journeys
events:
- EVENT_VIEW_TRACE
- API_PARTIAL_ENRICHMENT
- EVENT_VIEW_DOC
routes:
- /tasks/:id
- /trace/:id
- /docs
recovery_path: false
steps:
- order: 1
  route: /tasks/:id
  screen: screen:task-detail
  screen_ds_id: ds:screen:task-detail-001
  state: default
  event: EVENT_VIEW_TRACE
  expected_outcome: route, state, data-screen-id, data-ds-id, hash behavior, and Core
    WebUI API boundary remain traceable
  assertion: No browser direct DB/Zvec/git/gh/FastCode/shell access; all reads/writes
    go through Go REST API
  ds_targets:
  - ds:screen:task-detail-001
- order: 2
  route: /trace/:id
  screen: screen:trace-explorer
  screen_ds_id: ds:screen:trace-explorer-001
  state: partial
  event: API_PARTIAL_ENRICHMENT
  expected_outcome: route, state, data-screen-id, data-ds-id, hash behavior, and Core
    WebUI API boundary remain traceable
  assertion: No browser direct DB/Zvec/git/gh/FastCode/shell access; all reads/writes
    go through Go REST API
  ds_targets:
  - ds:screen:trace-explorer-001
- order: 3
  route: /docs
  screen: screen:doc-viewer
  screen_ds_id: ds:screen:core-doc-viewer-001
  state: default
  event: EVENT_VIEW_DOC
  expected_outcome: route, state, data-screen-id, data-ds-id, hash behavior, and Core
    WebUI API boundary remain traceable
  assertion: No browser direct DB/Zvec/git/gh/FastCode/shell access; all reads/writes
    go through Go REST API
  ds_targets:
  - ds:screen:core-doc-viewer-001
e2e_alignment:
  expected_outcome: Expected journey outcome is observable without forbidden browser
    data access.
  investigation_guidance: Assert route navigation, state transition, hash state where
    applicable, optimistic write or recovery copy, and API mapping.
