trajectory_id: core-navigate-task
role: PM
journey: Open dashboard, navigate task list, inspect detail
entry_path: /tasks/:id
events:
- EVENT_ROUTE_ENTER
- EVENT_VIEW_TASK
states:
- loading
- default
- empty
- error
- offline
- forbidden
error_paths:
- API_ERROR -> ErrorState -> EVENT_REFRESH
- API_FORBIDDEN -> ForbiddenState -> EVENT_BACK
- EVENT_DISCONNECT -> OfflineState -> EVENT_RECONNECT
screens:
- screen:global-shell
- screen:rtm-dashboard
- screen:task-list
- screen:task-detail
step_refs:
- step: 1
  screen_id: screen:global-shell
  screen_path: /design-system/webui-pm-workspace
  data_ds_id: ds:screen:webui-pm-workspace-001
  expected_state: loading_to_default
  event: EVENT_ROUTE_ENTER
  action: Dispatch EVENT_ROUTE_ENTER and verify screen:global-shell reaches loading_to_default
  hash_anchor: null
- step: 2
  screen_id: screen:rtm-dashboard
  screen_path: /
  data_ds_id: ds:screen:rtm-dashboard-001
  expected_state: default
  event: EVENT_VIEW_TASK
  action: Dispatch EVENT_VIEW_TASK and verify screen:rtm-dashboard reaches default
  hash_anchor: null
- step: 3
  screen_id: screen:task-list
  screen_path: /tasks
  data_ds_id: ds:screen:task-list-001
  expected_state: default
  event: EVENT_VIEW_TASK
  action: Dispatch EVENT_VIEW_TASK and verify screen:task-list reaches default
  hash_anchor: null
- step: 4
  screen_id: screen:task-detail
  screen_path: /tasks/:id
  data_ds_id: ds:screen:task-detail-001
  expected_state: default
  event: EVENT_VIEW_TASK
  action: Dispatch EVENT_VIEW_TASK and verify screen:task-detail reaches default
  hash_anchor: null
