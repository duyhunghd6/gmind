trajectory_id: portfolio-review
role: Executive
journey: Review portfolio budget and drill into blocked epic tasks
entry_path: /portfolio
events:
- EVENT_VIEW_TASK
- EVENT_VIEW_TRACE
states:
- loading
- default
- empty
- error
- offline
- forbidden
error_paths:
- API_ERROR -> ErrorState -> EVENT_REFRESH
- API_FORBIDDEN -> ForbiddenState -> EVENT_BACK
- EVENT_DISCONNECT -> OfflineState -> EVENT_RECONNECT
screens:
- screen:portfolio
- screen:task-list
- screen:trace-explorer
step_refs:
- step: 1
  screen_id: screen:portfolio
  screen_path: /portfolio
  data_ds_id: ds:screen:portfolio-001
  expected_state: loading_to_default
  event: EVENT_VIEW_TASK
  action: Dispatch EVENT_VIEW_TASK and verify screen:portfolio reaches loading_to_default
  hash_anchor: null
- step: 2
  screen_id: screen:task-list
  screen_path: /tasks
  data_ds_id: ds:screen:task-list-001
  expected_state: default
  event: EVENT_VIEW_TRACE
  action: Dispatch EVENT_VIEW_TRACE and verify screen:task-list reaches default
  hash_anchor: null
- step: 3
  screen_id: screen:trace-explorer
  screen_path: /trace/:id
  data_ds_id: ds:screen:trace-explorer-001
  expected_state: default
  event: EVENT_VIEW_TRACE
  action: Dispatch EVENT_VIEW_TRACE and verify screen:trace-explorer reaches default
  hash_anchor: null
