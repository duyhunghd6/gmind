trajectory_id: journey-global-search
title: Quick Search
source: PRD-04 user journeys
events:
- EVENT_SEARCH
- EVENT_VIEW_TASK
- EVENT_VIEW_DOC
- EVENT_VIEW_TRACE
routes:
- /search
- /tasks/:id
- /docs
- /trace/:id
recovery_path: false
steps:
- order: 1
  route: /search
  screen: screen:search-results
  screen_ds_id: ds:screen:search-results-001
  state: default
  event: EVENT_SEARCH
  expected_outcome: route, state, data-screen-id, data-ds-id, hash behavior, and Core
    WebUI API boundary remain traceable
  assertion: No browser direct DB/Zvec/git/gh/FastCode/shell access; all reads/writes
    go through Go REST API
