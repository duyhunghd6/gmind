trajectory_id: storyboard-detail-alignment
role: QA
journey: Open storyboard and validate E2E metadata
entry_path: /storyboards/core-navigate-task
events:
- EVENT_ROUTE_ENTER
- EVENT_VIEW_TASK
states:
- loading
- default
- empty
- error
- offline
- forbidden
error_paths:
- API_ERROR -> ErrorState -> EVENT_REFRESH
- API_FORBIDDEN -> ForbiddenState -> EVENT_BACK
- EVENT_DISCONNECT -> OfflineState -> EVENT_RECONNECT
screens:
- screen:storyboard-overview
- screen:storyboard-detail
step_refs:
- step: 1
  screen_id: screen:storyboard-overview
  screen_path: /storyboards
  data_ds_id: ds:screen:storyboard-001
  expected_state: loading_to_default
  event: EVENT_ROUTE_ENTER
  action: Dispatch EVENT_ROUTE_ENTER and verify screen:storyboard-overview reaches loading_to_default
  hash_anchor: null
- step: 2
  screen_id: screen:storyboard-detail
  screen_path: /storyboards/:id
  data_ds_id: ds:screen:storyboard-detail-001
  expected_state: default
  event: EVENT_VIEW_TASK
  action: Dispatch EVENT_VIEW_TASK and verify screen:storyboard-detail reaches default
  hash_anchor: null
