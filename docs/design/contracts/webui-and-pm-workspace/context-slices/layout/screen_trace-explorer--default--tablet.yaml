id: layout:screen:trace-explorer:default:tablet
screen_id: screen:trace-explorer
route: /trace/:id
screen_ds_id: ds:screen:trace-explorer-001
state: default
viewport: tablet
width: 1024
layout: full-page graph canvas with toolbar, filters, legend, and detail panel
responsive_constraint: condensed sidebar, stacked secondary panels, horizontal scroll
  where boards overflow
assertions:
- global shell remains reachable
- data-screen-id and data-ds-id present
- state copy includes recovery CTA when empty/error/forbidden/not_found
- browser uses Go REST API mappings only
