id: layout:screen:task-detail:saving:mobile
screen_id: screen:task-detail
route: /tasks/:id
screen_ds_id: ds:screen:task-detail-001
state: saving
viewport: mobile
width: 390
layout: editable task header with Detail, Activity, Graph, and Code tabs
responsive_constraint: single-column flow, sidebar as overlay, drawers as full-screen
  overlays, tables become cards
state_contract: edited controls disabled until API response or rollback
assertions:
- global shell remains reachable
- data-screen-id and data-ds-id present
