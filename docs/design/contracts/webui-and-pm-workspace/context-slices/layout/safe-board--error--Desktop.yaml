screen_id: safe-board
state_names:
- default
- loading
- empty
- error
- offline
- forbidden
viewport: Desktop
width: 1440
layout_type: kanban_board
ds_id: ds:webui.board.root
responsive_assertion: horizontal columns with WIP badges and stats strip
boundary_assertions:
