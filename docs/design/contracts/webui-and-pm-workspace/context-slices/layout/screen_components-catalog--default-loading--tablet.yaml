screen_id: screen:components-catalog
route: /design-system/components
state_matrix:
- default
- loading
- empty
- error
- offline
- forbidden
viewport: tablet
width: 1024
layout_assertion: Catalog of 18 shared primitives with hash scroll and interactive
  examples.
responsive_rules:
- Sidebar condenses to icon rail with tooltips.
- Detail panels become drawers or bottom sheets.
- Kanban and tables may scroll horizontally.
hash_anchors:
- buttons
- badges-status
- progress
- avatar-stack
- modal
- dropdown
- accordion
- tab-panel
- data-table
- tooltip
- code-block
- cards
- prompt-card
- section-labels
- status-dots
- skeleton
- empty-state
- error-banner
keyboard_a11y:
- WCAG AA contrast and visible focus indicators.
- Keyboard access for routes, tabs, filters, tables, cards, graph controls, and dialogs.
- Every state color has visible text label and aria-label where status is compact.
- Error, offline, saving, and sync messages use aria-live polite unless destructive.
- Escape closes modal, drawer, dropdown, and command palette through shared keyboard
  handling.
