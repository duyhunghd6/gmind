id: layout:screen:task-detail:error:desktop
screen_id: screen:task-detail
route: /tasks/:id
screen_ds_id: ds:screen:task-detail-001
state: error
viewport: desktop
width: 1440
layout: editable task header with Detail, Activity, Graph, and Code tabs
responsive_constraint: persistent shell, expanded sidebar, multi-panel layouts
state_contract: short cause plus retry or recovery action
assertions:
- global shell remains reachable
- data-screen-id and data-ds-id present
- state copy includes recovery CTA when empty/error/forbidden/not_found
- browser uses Go REST API mappings only
- hash interactions update same-route or cross-route selection when specified
