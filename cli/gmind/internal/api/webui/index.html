<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmind RTM Dashboard</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1a1a1a;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #00bcd4; }
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .panel {
            background-color: #262626;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
        }
        .panel h2 { margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 10px; }
        pre { background-color: #000; padding: 10px; overflow: auto; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>gmind RTM Dashboard</h1>
    <div class="dashboard">
        <div class="panel" id="coverage">
            <h2>Coverage Heatmap</h2>
            <div id="coverage-content">Loading...</div>
        </div>
        <div class="panel" id="progress">
            <h2>Task Progress</h2>
            <div id="progress-content">Loading...</div>
        </div>
        <div class="panel" id="graph">
            <h2>Knowledge Graph</h2>
            <div id="graph-content">Knowledge Graph Visualization (D3.js)</div>
        </div>
        <div class="panel" id="gaps">
            <h2>Gap Analysis</h2>
            <div id="gaps-content">Loading...</div>
        </div>
    </div>

    <script>
        async function fetchData(url, elementId) {
            try {
                const response = await fetch(url);
                const data = await response.json();
                document.getElementById(elementId).innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            } catch (error) {
                document.getElementById(elementId).innerHTML = 'Error: ' + error.message;
            }
        }

        fetchData('/api/coverage?mode=full', 'coverage-content');
        fetchData('/api/tasks', 'progress-content');
        fetchData('/api/gaps?mode=prd-to-plan', 'gaps-content');
    </script>
</body>
</html>
